system {
    host-name acc1;
}
vlans {
    v1627 {
        vlan-id 1627;
    }
    v2676 {
        vlan-id 2676;
    }
}
interfaces {
    ge-0/0/8 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/16 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1627 v2676 ];
                }
            }
        }
    }
    ge-0/0/18 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/3 {
        ether-options {
            802.3ad ae1;
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                passive;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1627 v2676 ];
                }
            }
        }
    }
    ge-0/0/19 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v1627;
                }
            }
        }
    }
    ge-0/0/13 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v2676;
                }
            }
        }
    }
}
protocols {
    rstp {
        interface ae0;
        interface ae1;
    }
}
