system {
    host-name core2;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.164.255.2/32;
            }
        }
    }
    ge-0/0/12 {
        unit 0 {
            family inet {
                address 10.164.0.2/30;
            }
        }
    }
    ge-0/0/4 {
        unit 0 {
            family inet {
                address 10.164.0.9/30;
            }
        }
    }
    irb {
        unit 1136 {
            family inet {
                address 172.16.36.3/24 {
                    vrrp-group 58 {
                        virtual-address 172.16.36.1;
                        priority 100;
                        preempt;
                    }
                }
            }
        }
        unit 1013 {
            family inet {
                address 172.17.87.3/24 {
                    vrrp-group 36 {
                        virtual-address 172.17.87.1;
                        priority 100;
                        preempt;
                    }
                }
            }
        }
    }
    ge-0/0/9 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/14 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1136 v1013 ];
                }
            }
        }
    }
    ge-0/0/7 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/13 {
        ether-options {
            802.3ad ae1;
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1136 v1013 ];
                }
            }
        }
    }
    ge-0/0/20 {
        ether-options {
            802.3ad ae2;
        }
    }
    ge-0/0/6 {
        ether-options {
            802.3ad ae2;
        }
    }
    ae2 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1136 v1013 ];
                }
            }
        }
    }
}
routing-options {
    router-id 10.164.255.2;
    autonomous-system 64626;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/12.0 {
                interface-type p2p;
            }
            interface ge-0/0/4.0 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
            interface irb.1136 {
                passive;
            }
            interface irb.1013 {
                passive;
            }
        }
    }
    bgp {
        group IBGP {
            type internal;
            local-address 10.164.255.2;
            neighbor 10.164.255.1;
            neighbor 10.164.255.3;
        }
    }
    rstp {
        interface ae0;
        interface ae1;
        interface ae2;
        bridge-priority 8k;
    }
}
vlans {
    v1136 {
        vlan-id 1136;
        l3-interface irb.1136;
    }
    v1013 {
        vlan-id 1013;
        l3-interface irb.1013;
    }
}
