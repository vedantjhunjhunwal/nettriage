system {
    host-name acc2;
}
vlans {
    v1136 {
        vlan-id 1136;
    }
    v1013 {
        vlan-id 1013;
    }
}
interfaces {
    ge-0/0/4 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/20 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1136 v1013 ];
                }
            }
        }
    }
    ge-0/0/21 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/12 {
        ether-options {
            802.3ad ae1;
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1136 v1013 ];
                }
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v1136;
                }
            }
        }
    }
    ge-0/0/17 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v1013;
                }
            }
        }
    }
}
protocols {
    rstp {
        interface ae0;
        interface ae1;
    }
}
