system {
    host-name core2;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.83.255.2/32;
            }
        }
    }
    ge-0/0/6 {
        unit 0 {
            family inet {
                address 10.83.0.2/30;
            }
        }
    }
    ge-0/0/14 {
        unit 0 {
            family inet {
                address 10.83.0.9/30;
            }
        }
    }
    irb {
        unit 1627 {
            family inet {
                address 172.16.37.3/24 {
                    vrrp-group 13 {
                        virtual-address 172.16.37.1;
                        priority 100;
                        preempt;
                    }
                }
            }
        }
        unit 2676 {
            family inet {
                address 172.17.60.3/24 {
                    vrrp-group 19 {
                        virtual-address 172.17.60.1;
                        priority 100;
                        preempt;
                    }
                }
            }
        }
    }
    ge-0/0/9 {
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/19 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1627 v2676 ];
                }
            }
        }
    }
    ge-0/0/23 {
        ether-options {
            802.3ad ae1;
        }
    }
    ge-0/0/3 {
        ether-options {
            802.3ad ae1;
        }
    }
    ae1 {
        aggregated-ether-options {
            lacp {
                passive;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1627 v2676 ];
                }
            }
        }
    }
    ge-0/0/18 {
        ether-options {
            802.3ad ae2;
        }
    }
    ge-0/0/1 {
        ether-options {
            802.3ad ae2;
        }
    }
    ae2 {
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ v1627 v2676 ];
                }
            }
        }
    }
}
routing-options {
    router-id 10.83.255.2;
    autonomous-system 65482;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/6.0 {
                interface-type p2p;
            }
            interface ge-0/0/14.0 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
            interface irb.1627 {
                passive;
            }
            interface irb.2676 {
                passive;
            }
        }
    }
    bgp {
        group IBGP {
            type internal;
            local-address 10.83.255.2;
            neighbor 10.83.255.1;
            neighbor 10.83.255.3;
        }
    }
    rstp {
        interface ae0;
        interface ae1;
        interface ae2;
        bridge-priority 8k;
    }
}
vlans {
    v1627 {
        vlan-id 1627;
        l3-interface irb.1627;
    }
    v2676 {
        vlan-id 2676;
        l3-interface irb.2676;
    }
}
